name = "btt-checkin"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Johnny: paste the database_id returned by `wrangler d1 create btt-checkin`.
[[d1_databases]]
binding = "DB"
database_name = "btt-checkin"
database_id = "d5c7a102-f226-4ebe-b4b8-78ac6fcbd71a"

[vars]
GHL_LOCATION_ID = "ARCSFhJ0JlkcuzfZtyEJ"
TZ = "America/New_York"
MEMBER_TAGS = "founding-member"
MEMBER_TAG_PREFIXES = "foundations-"

# Cron runs in UTC. Roster sync every 30 min. Rollup fires at both 07:00 and
# 08:00 UTC; the scheduled handler runs it only when the ET hour is 3, so it
# lands at 03:00 ET year-round across DST.
[triggers]
crons = ["*/30 * * * *", "0 7 * * *", "0 8 * * *"]

# Kiosk and staff pages plus their JS live in public/. The Worker runs first
# so it decides what is served (the staff page is gated) and everything
# else goes through env.ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[observability]
enabled = true

# Public routes: 60 requests / minute / IP (§7).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Staff login: 5 attempts / minute / IP. The PIN is 4 digits.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
