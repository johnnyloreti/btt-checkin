name = "btt-checkin"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Johnny: paste the database_id returned by `wrangler d1 create btt-checkin`.
[[d1_databases]]
binding = "DB"
database_name = "btt-checkin"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
GHL_LOCATION_ID = "ARCSFhJ0JlkcuzfZtyEJ"
TZ = "America/New_York"
MEMBER_TAGS = "founding-member"
MEMBER_TAG_PREFIXES = "foundations-"
# Waiver prompt (§15.1). The tag a signed waiver leaves on the student's
# contact, and the custom field written at check-in when it is missing so a
# GHL workflow can send the reminder. Empty WAIVER_TAG turns the feature off.
WAIVER_TAG = "waiver-signed"
WAIVER_FIELD = "checkin_last_at"

# One trigger every 30 minutes drives both jobs. The handler runs the
# roster sync on every tick and the rollup on the tick that is 03:00 ET.
# Workers Free allows 5 cron triggers per account, so this uses one.
[triggers]
crons = ["*/30 * * * *"]

# Kiosk and staff pages plus their JS live in public/. The Worker runs first
# so it decides what is served (the staff page is gated) and everything
# else goes through env.ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[observability]
enabled = true

# Public routes: 60 requests / minute / IP (§7).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Staff login: 5 attempts / minute / IP. The PIN is 4 digits.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
