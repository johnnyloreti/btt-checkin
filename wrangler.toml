name = "btt-checkin"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Johnny: paste the database_id returned by `wrangler d1 create btt-checkin`.
[[d1_databases]]
binding = "DB"
database_name = "btt-checkin"
database_id = "d5c7a102-f226-4ebe-b4b8-78ac6fcbd71a"

[vars]
GHL_LOCATION_ID = "ARCSFhJ0JlkcuzfZtyEJ"
TZ = "America/New_York"
MEMBER_TAGS = "founding-member"
MEMBER_TAG_PREFIXES = "foundations-"

# Check-in window in minutes: how long before a class starts, and how long
# after it starts, a member may still check in to it. 180/180 set 2026-09-16.
CHECKIN_EARLY_MIN = "180"
CHECKIN_LATE_MIN = "180"

# How many days back a check-in may be dated. The kiosk only needs room for a
# queued retry to land; staff need room to backfill a class nobody tapped for.
KIOSK_BACKDATE_DAYS = "3"
STAFF_BACKDATE_DAYS = "30"

# Stripe tab (§15.2). Classes between stripes, and which programs it covers.
# An empty STRIPE_PROGRAMS turns the tab off. Adults added when Johnny says so.
STRIPE_CLASSES = "7"
STRIPE_PROGRAMS = "kids-3-5,kids-6-9,kids-10-14"

# Drink tab (§15.3). Keys into tab-items.json; empty TAB_ITEMS turns the tab
# off. TAB_PROGRAMS: a member buys only if every program they hold is listed
# here (adults only in Phase 1; a kid in an adult class is excluded until 1b).
# A payer is charged when their open tab reaches TAB_MIN_CENTS or their oldest
# open purchase is TAB_MAX_ROLL_DAYS old. PUBLIC_ORIGIN is the host in the PIN
# setup link texted to members; behind the Netlify proxy the Worker cannot see it.
TAB_ITEMS = "water,hydration"
TAB_PROGRAMS = "adult"
TAB_MIN_CENTS = "500"
TAB_MAX_ROLL_DAYS = "28"
# ET hour when the cron charges everyone who is due (the PIN was the
# authorization). Blank turns the automatic run off; the staff button stays.
TAB_AUTO_HOUR = "20"
PUBLIC_ORIGIN = "https://checkin.bttbridgewater.com"

# Waiver prompt (§15.1). The tag a signed waiver leaves on the student's
# contact, and the custom field written at check-in when it is missing so a
# GHL workflow can send the reminder. Empty WAIVER_TAG turns the feature off.
WAIVER_TAG = "waiver-signed"
WAIVER_FIELD = "checkin_last_at"

# One trigger every 30 minutes drives both jobs. The handler runs the
# roster sync on every tick and the rollup on the tick that is 03:00 ET.
# Workers Free allows 5 cron triggers per account, so this uses one.
[triggers]
crons = ["*/30 * * * *"]

# Kiosk and staff pages plus their JS live in public/. The Worker runs first
# so it decides what is served (the staff page is gated) and everything
# else goes through env.ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[observability]
enabled = true

# Public routes: 60 requests / minute / IP (§7).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Staff login: 5 attempts / minute / IP. The PIN is 4 digits.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
