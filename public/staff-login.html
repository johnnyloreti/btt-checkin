<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #09090a; --bone: #f4f1e9; --gold: #e7c24c; --muted: rgba(244,241,233,.55); --line: rgba(244,241,233,.14); --tile: rgba(244,241,233,.06); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--bone); font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .brand { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-size: 16px; margin: 0 0 6px; }
  h1 { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 500; font-size: 40px; margin: 0 0 28px; }
  form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
  input { font: inherit; font-size: 34px; letter-spacing: .5em; text-align: center; padding: 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); color: var(--bone); outline: none; }
  input:focus { border-color: var(--gold); }
  button { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: .08em; text-transform: uppercase; padding: 18px; border-radius: 14px; border: none; background: var(--gold); color: #1a1607; cursor: pointer; }
  .msg { min-height: 24px; text-align: center; color: var(--gold); font-size: 16px; }
</style>
</head>
<body>
  <p class="brand">Brazilian Top Team Bridgewater</p>
  <h1>Staff</h1>
  <form id="form" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN" aria-label="Staff PIN" autofocus>
    <button type="submit">Sign in</button>
    <div id="msg" class="msg"></div>
  </form>
<script>
  const form = document.getElementById('form');
  const pin = document.getElementById('pin');
  const msg = document.getElementById('msg');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    try {
      const res = await fetch('/api/staff/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin: pin.value }) });
      if (res.ok) { location.replace('/staff'); return; }
      msg.textContent = res.status === 429 ? 'Too many tries. Wait a minute.' : 'Wrong PIN';
    } catch {
      msg.textContent = 'No connection. Try again.';
    }
    pin.value = '';
    pin.focus();
  });
</script>
</body>
</html>
