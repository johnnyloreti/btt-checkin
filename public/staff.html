<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #09090a; --bone: #f4f1e9; --gold: #e7c24c; --muted: rgba(244,241,233,.55); --line: rgba(244,241,233,.14); --tile: rgba(244,241,233,.06); --display: 'Oswald', 'Arial Narrow', sans-serif; --body: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--bone); font-family: var(--body); }
  body { min-height: 100%; padding: 0 0 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header .brand { font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; color: var(--muted); margin-right: auto; }
  .tab { font: inherit; font-weight: 600; font-size: 15px; background: none; border: 1px solid var(--line); color: var(--bone); padding: 10px 16px; border-radius: 999px; cursor: pointer; }
  .tab.active { background: var(--gold); color: #1a1607; border-color: var(--gold); }
  .tab.quiet { color: var(--muted); }
  main { max-width: 720px; margin: 0 auto; padding: 18px; }
  .view { display: none; }
  .view.active { display: block; }
  h2 { font-family: var(--display); font-weight: 500; font-size: 32px; margin: 8px 0 16px; display: flex; align-items: center; gap: 12px; }
  h2 .sub { color: var(--gold); font-size: 22px; }
  .datebar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .datebar button { font: inherit; font-size: 22px; background: var(--tile); border: 1px solid var(--line); color: var(--bone); width: 52px; height: 48px; border-radius: 12px; cursor: pointer; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; font-size: 18px; text-align: left; color: var(--bone); width: 100%; font-family: var(--body); }
  button.row { cursor: pointer; }
  button.row:active { border-color: var(--gold); }
  .row .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 84px; }
  .row .name { font-weight: 600; flex: 1; }
  .row .count { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .tag { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; }
  .row .tag.warn { color: var(--gold); border-color: var(--gold); }
  .row .tag.gold { color: #1a1607; background: var(--gold); border-color: var(--gold); }
  .row.sub { margin-left: 28px; padding: 10px 16px; font-size: 16px; background: transparent; }
  .row .status { color: var(--muted); font-size: 15px; }
  .row .status.gold { color: var(--gold); }
  .btn.primary:disabled { opacity: .45; cursor: default; }
  .status a { color: var(--gold); }
  .row .check { color: var(--gold); font-weight: 700; }
  .row .remove { font: inherit; font-size: 14px; font-weight: 600; background: none; border: 1px solid var(--line); color: var(--muted); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .row .remove.confirm { color: #1a1607; background: var(--gold); border-color: var(--gold); }
  .empty { color: var(--muted); padding: 20px 4px; font-size: 17px; }
  .note { color: var(--muted); font-size: 15px; margin: -6px 0 16px; }
  .row .since { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .award { font: inherit; font-size: 14px; font-weight: 600; background: var(--gold); border: 1px solid var(--gold); color: #1a1607; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .row .award.confirm { background: transparent; color: var(--gold); }
  .row .undo { font: inherit; font-size: 14px; font-weight: 600; background: none; border: 1px solid var(--line); color: var(--muted); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .btn { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: var(--bone); cursor: pointer; width: 100%; margin-top: 14px; }
  .btn.primary { background: var(--gold); color: #1a1607; border-color: var(--gold); }
  .back { font: inherit; font-size: 16px; color: var(--muted); background: none; border: none; padding: 8px 0; cursor: pointer; }
  .search { width: 100%; font: inherit; font-size: 22px; padding: 16px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); color: var(--bone); outline: none; }
  .search:focus { border-color: var(--gold); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { font-family: var(--body); text-align: left; background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; color: var(--bone); cursor: pointer; }
  .tile .n { font-size: 20px; font-weight: 600; }
  .tile .p { font-size: 13px; color: var(--gold); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 14px 0 22px; }
  .fact { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .fact .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .fact .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .fact .v.gold { color: var(--gold); }
  .status { color: var(--muted); font-size: 14px; margin-top: 26px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .status button { font: inherit; font-size: 14px; background: none; border: 1px solid var(--line); color: var(--bone); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 5; display: none; flex-direction: column; padding: 18px; overflow-y: auto; }
  .overlay.active { display: flex; }
  .overlay .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .picklabel { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 8px; }
  input[type="date"].search { -webkit-appearance: none; appearance: none; min-height: 58px; }
  input[type="date"].search::-webkit-date-and-time-value { text-align: left; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold); color: #1a1607; font-weight: 600; padding: 12px 18px; border-radius: 12px; display: none; z-index: 9; }
  .toast.active { display: block; }
</style>
</head>
<body>
<header>
  <span class="brand">BTT Staff</span>
  <button class="tab active" data-tab="tonight" type="button">Tonight</button>
  <button class="tab" data-tab="stripes" type="button">Stripes</button>
  <button class="tab" data-tab="members" type="button">Members</button>
  <button class="tab" data-tab="tab" id="tab-nav" type="button">Tab</button>
  <button class="tab quiet" id="signout" type="button">Sign out</button>
</header>

<main>
  <section id="tonight" class="view active">
    <div class="datebar">
      <button id="prev-day" type="button" aria-label="Previous day">&#8249;</button>
      <h2 id="tonight-title" style="margin:0"></h2>
      <button id="next-day" type="button" aria-label="Next day">&#8250;</button>
    </div>
    <div id="tonight-list" class="list"></div>
    <div class="status">
      <span id="sync-status"></span>
      <button id="sync-now" type="button">Sync roster now</button>
    </div>
  </section>

  <section id="class" class="view">
    <button class="back" id="class-back" type="button">&#8249; Back to the day</button>
    <h2 id="class-title"></h2>
    <div id="class-list" class="list"></div>
    <button class="btn primary" id="add-student" type="button">+ Add student</button>
  </section>

  <section id="stripes" class="view">
    <h2>Stripes <span class="sub" id="stripes-rule"></span></h2>
    <p class="note" id="stripes-note">Eligible for review. Class count is one input, the call is yours.</p>
    <div id="stripes-list" class="list"></div>
  </section>

  <section id="tabview" class="view">
    <div class="datebar">
      <button id="tab-prev" type="button" aria-label="Previous day">&#8249;</button>
      <h2 id="tab-title" style="margin:0">Tab</h2>
      <button id="tab-next" type="button" aria-label="Next day">&#8250;</button>
    </div>
    <p class="note" id="tab-summary"></p>
    <button class="btn" id="tab-closeout" type="button" style="display:none;margin:0 0 18px">Review and charge</button>
    <div id="tab-activity" class="list" style="margin-bottom:18px"></div>
    <div id="tab-list" class="list"></div>
  </section>

  <section id="closeout" class="view">
    <button class="back" id="closeout-back" type="button">&#8249; Back to the tab</button>
    <h2>Review and charge <span class="sub" id="closeout-sub"></span></h2>
    <p class="note" id="closeout-note"></p>
    <div id="closeout-list" class="list"></div>
    <button class="btn primary" id="closeout-charge" type="button" style="display:none"></button>
    <div id="closeout-progress" class="list" style="margin-top:18px"></div>
  </section>

  <section id="members" class="view">
    <h2>Members</h2>
    <input id="member-search" class="search" type="text" placeholder="Search any member" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
    <div id="member-tiles" class="tiles"></div>
  </section>

  <section id="member" class="view">
    <button class="back" id="member-back" type="button">&#8249; Back to members</button>
    <h2 id="member-title"></h2>
    <div id="member-facts" class="facts"></div>
    <button class="btn" id="member-add-class" type="button">+ Add a class</button>
    <div id="member-tab" style="display:none">
      <h2 style="font-size:22px">Tab <span class="sub" id="member-tab-total"></span></h2>
      <div id="member-tab-actions" class="status" style="margin:0 0 12px"></div>
      <div id="member-tab-list" class="list"></div>
    </div>
    <h2 style="font-size:22px">Stripes and belts</h2>
    <div id="member-promotions" class="list"></div>
    <h2 style="font-size:22px">Last 30 days</h2>
    <div id="member-history" class="list"></div>
  </section>
</main>

<div id="add-overlay" class="overlay">
  <div class="top">
    <h2 id="add-title" style="margin:0"></h2>
    <button class="back" id="add-close" type="button">Close</button>
  </div>
  <input id="add-search" class="search" type="text" placeholder="Type a name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
  <div id="add-tiles" class="tiles"></div>
</div>

<div id="pick-overlay" class="overlay">
  <div class="top">
    <h2 id="pick-title" style="margin:0"></h2>
    <button class="back" id="pick-close" type="button">Close</button>
  </div>
  <label class="picklabel" for="pick-date">Which day</label>
  <input id="pick-date" class="search" type="date">
  <p class="note" id="pick-note" style="margin:14px 0 0"></p>
  <div id="pick-list" class="list" style="margin-top:14px"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
  import { search, formatTime, displayName } from '/search.js';

  const $ = (id) => document.getElementById(id);
  const UNSCHEDULED = 'open mat / unscheduled';
  let tz = 'America/New_York';
  let date = null;          // "YYYY-MM-DD" being viewed
  let current = null;       // { name, startLocal } of the open class
  let picking = null;       // the member whose Add a class overlay is open
  let tabDate = null;       // "YYYY-MM-DD" shown on the Tab view
  let roster = [];
  let rosterAt = 0;

  // ---------- helpers ----------
  async function api(path, opts = {}) {
    const res = await fetch(path, { cache: 'no-store', ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
    if (res.status === 401) { location.replace('/staff'); throw new Error('signed out'); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  }
  const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('active');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('active'), 1800);
  }
  function fmtClock(iso) {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' });
  }
  function fmtDate(ymd) {
    const [y, m, d] = ymd.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
  }
  function shiftDate(ymd, days) {
    const [y, m, d] = ymd.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, d + days));
    return `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(t.getUTCDate()).padStart(2, '0')}`;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function showView(id) {
    for (const v of document.querySelectorAll('.view')) v.classList.toggle('active', v.id === id);
    const tab = id === 'tonight' || id === 'class' ? 'tonight' : id === 'stripes' ? 'stripes' : id === 'tabview' || id === 'closeout' ? 'tab' : 'members';
    for (const t of document.querySelectorAll('.tab[data-tab]')) t.classList.toggle('active', t.dataset.tab === tab);
    window.scrollTo(0, 0);
  }
  async function loadRoster(force = false) {
    if (!force && roster.length && Date.now() - rosterAt < 5 * 60_000) return roster;
    roster = await api('/api/roster');
    rosterAt = Date.now();
    return roster;
  }

  // ---------- tonight ----------
  async function loadTonight() {
    const data = await api(`/api/staff/today${date ? `?date=${date}` : ''}`);
    tz = data.timezone || tz;
    date = data.date;
    $('tonight-title').textContent = fmtDate(date);
    const list = $('tonight-list');
    list.innerHTML = '';
    if (data.classes.length === 0) {
      list.appendChild(el('div', 'empty', 'No classes this day'));
      return;
    }
    for (const c of data.classes) {
      const b = el('button', 'row');
      b.type = 'button';
      b.dataset.start = c.startLocal;
      b.dataset.name = c.name;
      b.append(
        el('span', 'time', c.start ? formatTime(c.start) : 'Any time'),
        el('span', 'name', c.name === UNSCHEDULED ? 'Open mat, unscheduled' : c.name),
        el('span', 'count', `${c.count} checked in`),
      );
      b.addEventListener('click', () => openClass(c));
      list.appendChild(b);
    }
  }
  $('prev-day').addEventListener('click', () => { date = shiftDate(date, -1); loadTonight(); });
  $('next-day').addEventListener('click', () => { date = shiftDate(date, 1); loadTonight(); });

  async function loadStatus() {
    try {
      const h = await (await fetch('/health', { cache: 'no-store' })).json();
      const when = h.lastRosterSync ? `${fmtDate(h.lastRosterSync.slice(0, 10))} ${fmtClock(h.lastRosterSync)}` : 'never';
      $('sync-status').textContent = `${h.memberCount ?? 0} members. Last roster sync ${when}${h.lastRosterOutcome && h.lastRosterOutcome !== 'ok' ? ` (${h.lastRosterOutcome})` : ''}.`;
    } catch {
      $('sync-status').textContent = 'Status unavailable';
    }
  }
  $('sync-now').addEventListener('click', async () => {
    $('sync-now').disabled = true;
    try {
      const r = await post('/api/staff/sync', {});
      toast(r.outcome === 'ok' ? `Synced ${r.members} members` : `Sync ${r.outcome}: ${r.reason || r.error || ''}`);
      await loadRoster(true);
    } catch (e) {
      toast(`Sync failed: ${e.message}`);
    } finally {
      $('sync-now').disabled = false;
      loadStatus();
    }
  });

  // ---------- class roster ----------
  async function openClass(c) {
    current = { name: c.name, startLocal: c.startLocal, start: c.start };
    $('class-title').innerHTML = '';
    $('class-title').append(
      document.createTextNode(c.name === UNSCHEDULED ? 'Open mat' : c.name),
      el('span', 'sub', c.start ? formatTime(c.start) : fmtDate(date)),
    );
    showView('class');
    await loadClass();
  }
  async function loadClass() {
    const data = await api(`/api/staff/class?start=${encodeURIComponent(current.startLocal)}&name=${encodeURIComponent(current.name)}`);
    const list = $('class-list');
    list.innerHTML = '';
    if (data.rows.length === 0) list.appendChild(el('div', 'empty', 'Nobody checked in yet'));
    for (const r of data.rows) {
      const row = el('div', 'row');
      row.dataset.attendanceId = r.attendanceId;
      row.append(el('span', 'check', '✓'), el('span', 'name', displayName(r)), el('span', 'time', fmtClock(r.checkedInAt)));
      if (r.method === 'staff') row.appendChild(el('span', 'tag', 'staff'));
      if (r.statusAtCheckin === 'inactive') row.appendChild(el('span', 'tag warn', 'inactive'));
      if (r.waiver === false) row.appendChild(el('span', 'tag warn', 'no waiver'));
      const rm = el('button', 'remove', 'Remove');
      rm.type = 'button';
      rm.addEventListener('click', async () => {
        if (!rm.classList.contains('confirm')) {
          rm.classList.add('confirm');
          rm.textContent = 'Confirm remove';
          setTimeout(() => { rm.classList.remove('confirm'); rm.textContent = 'Remove'; }, 4000);
          return;
        }
        await post('/api/staff/void', { attendanceId: r.attendanceId });
        toast(`Removed ${r.first}`);
        await loadClass();
      });
      row.appendChild(rm);
      list.appendChild(row);
    }
  }
  $('class-back').addEventListener('click', async () => { showView('tonight'); await loadTonight(); });

  // ---------- add student ----------
  $('add-student').addEventListener('click', async () => {
    $('add-title').textContent = `Add to ${current.name === UNSCHEDULED ? 'open mat' : current.name}`;
    $('add-search').value = '';
    $('add-tiles').innerHTML = '';
    $('add-overlay').classList.add('active');
    $('add-search').focus();
    await loadRoster();
    // Staff type the moment the overlay opens, which can beat the roster
    // fetch. Render again with whatever is already in the box, or their
    // first few letters would show nothing until they typed another.
    if ($('add-search').value) renderTiles($('add-tiles'), $('add-search').value, addMember);
  });
  $('add-close').addEventListener('click', () => $('add-overlay').classList.remove('active'));
  $('add-search').addEventListener('input', () => renderTiles($('add-tiles'), $('add-search').value, addMember));
  async function addMember(m) {
    try {
      const r = await post('/api/staff/add', { contactId: m.id, className: current.name, classStartLocal: current.startLocal });
      toast(r.duplicate ? `${m.first} was already on the list` : `Added ${m.first}`);
      $('add-overlay').classList.remove('active');
      await loadClass();
    } catch (e) {
      toast(`Could not add: ${e.message}`);
    }
  }
  function renderTiles(container, q, onPick) {
    container.innerHTML = '';
    for (const m of search(roster, q)) {
      const t = el('button', 'tile');
      t.type = 'button';
      t.dataset.id = m.id;
      t.append(el('div', 'n', displayName(m)), el('div', 'p', m.program || ''));
      t.addEventListener('click', () => onPick(m));
      container.appendChild(t);
    }
  }

  // ---------- stripes (§15.2) ----------
  async function loadStripes() {
    const list = $('stripes-list');
    list.innerHTML = '';
    let data;
    try {
      data = await api('/api/staff/stripes');
    } catch (e) {
      list.appendChild(el('div', 'empty', e.message));
      return;
    }
    $('stripes-rule').textContent = data.threshold ? `every ${data.threshold} classes` : '';
    if (!data.enabled) {
      $('stripes-note').textContent = '';
      list.appendChild(el('div', 'empty', data.pendingMigration ? 'Stripe tracking needs its database migration.' : 'Stripe tracking is off.'));
      return;
    }
    $('stripes-note').textContent = 'Eligible for review. Class count is one input, the call is yours.';
    if (data.rows.length === 0) {
      list.appendChild(el('div', 'empty', 'Nobody is eligible right now'));
      return;
    }
    for (const r of data.rows) {
      const row = el('div', 'row');
      row.dataset.id = r.id;
      row.append(
        el('span', 'name', `${r.first} ${r.last}`.trim()),
        el('span', 'since', `${r.since} since ${r.lastAwardedOn ? 'last stripe' : 'their first class'}`),
      );
      if (r.worth > 1) row.appendChild(el('span', 'tag warn', `${r.worth} worth`));
      const award = el('button', 'award', 'Record stripe');
      award.type = 'button';
      award.addEventListener('click', async () => {
        if (!award.classList.contains('confirm')) {
          award.classList.add('confirm');
          award.textContent = 'Confirm stripe';
          setTimeout(() => { award.classList.remove('confirm'); award.textContent = 'Record stripe'; }, 4000);
          return;
        }
        try {
          await post('/api/staff/promote', { contactId: r.id, kind: 'stripe' });
          toast(`Stripe recorded for ${r.first}`);
          await loadStripes();
        } catch (e) {
          toast(`Could not record: ${e.message}`);
        }
      });
      row.appendChild(award);
      list.appendChild(row);
    }
  }

  // ---------- members ----------
  $('member-search').addEventListener('input', async () => {
    await loadRoster();
    renderTiles($('member-tiles'), $('member-search').value, openMember);
  });
  async function openMember(m) {
    const d = await api(`/api/staff/member?id=${encodeURIComponent(m.id)}`);
    $('member-title').textContent = `${d.first} ${d.last}`.trim();
    const facts = $('member-facts');
    facts.innerHTML = '';
    const fact = (k, v, gold) => { const f = el('div', 'fact'); f.append(el('div', 'k', k), el('div', `v${gold ? ' gold' : ''}`, v)); facts.appendChild(f); };
    fact('Program', d.programLabels.join(' / ') || 'none');
    fact('Lifetime', `Class #${d.lifetime}`, true);
    fact('Status', d.active ? 'Active' : 'Inactive');
    fact('Waiver', d.waiver ? 'On file' : 'Missing', !d.waiver);
    fact('Roster synced', d.syncedAt ? `${fmtDate(d.syncedAt.slice(0, 10))} ${fmtClock(d.syncedAt)}` : 'never');
    fact('GHL rollup', d.rollupPending ? 'Pending tonight' : 'Up to date');
    renderPromotions(d, m);
    renderMemberTab(d, m);
    picking = {
      m,
      first: d.first,
      programs: Array.isArray(d.programs) ? d.programs : [],
      // Classes they are already on, so the picker can say so before the tap.
      attended: new Set(d.last30.filter((r) => r.status === 'attended').map((r) => r.classStartLocal)),
    };
    const list = $('member-history');
    list.innerHTML = '';
    if (d.last30.length === 0) list.appendChild(el('div', 'empty', 'No check-ins in the last 30 days'));
    for (const r of d.last30) {
      const row = el('div', 'row');
      row.append(
        el('span', 'time', fmtDate(r.classStartLocal.slice(0, 10))),
        el('span', 'name', r.className === UNSCHEDULED ? 'Open mat' : `${r.className} ${formatTime(r.classStartLocal.slice(11))}`),
        el('span', 'time', fmtClock(r.checkedInAt)),
      );
      if (r.method === 'staff') row.appendChild(el('span', 'tag', 'staff'));
      if (r.status === 'voided') row.appendChild(el('span', 'tag warn', 'removed'));
      list.appendChild(row);
    }
    showView('member');
  }
  function renderPromotions(d, m) {
    const box = $('member-promotions');
    box.innerHTML = '';
    const promos = Array.isArray(d.promotions) ? d.promotions : [];
    if (promos.length === 0) {
      box.appendChild(el('div', 'empty', 'No stripes or belts recorded'));
      return;
    }
    promos.forEach((p, i) => {
      const row = el('div', 'row');
      row.append(
        el('span', 'time', fmtDate(p.awardedOn)),
        el('span', 'name', p.kind === 'belt' ? 'Belt' : 'Stripe'),
        el('span', 'time', `at class ${p.atClassCount}`),
      );
      if (i === 0) {
        const undo = el('button', 'undo', 'Undo');
        undo.type = 'button';
        undo.addEventListener('click', async () => {
          if (undo.textContent === 'Undo') {
            undo.textContent = 'Confirm undo';
            setTimeout(() => { undo.textContent = 'Undo'; }, 4000);
            return;
          }
          await post('/api/staff/promote/undo', { contactId: m.id });
          toast('Removed');
          await openMember(m);
        });
        row.appendChild(undo);
      }
      box.appendChild(row);
    });
  }
  $('member-back').addEventListener('click', () => showView('members'));

  // ---------- add a class, starting from the member (§3) ----------
  // The class roster route is the way in when a whole class was missed. This
  // is the way in when one person was: pick the day, see only their classes.
  $('member-add-class').addEventListener('click', async () => {
    if (!picking) return;
    $('pick-title').textContent = `Add a class for ${picking.first}`;
    $('pick-note').textContent = '';
    $('pick-list').innerHTML = '';
    $('pick-overlay').classList.add('active');
    await loadPick(null);
  });
  $('pick-close').addEventListener('click', () => $('pick-overlay').classList.remove('active'));
  $('pick-date').addEventListener('change', () => loadPick($('pick-date').value));

  async function loadPick(day) {
    const list = $('pick-list');
    list.innerHTML = '';
    $('pick-note').textContent = '';
    let data;
    try {
      data = await api(`/api/staff/today${day ? `?date=${encodeURIComponent(day)}` : ''}`);
    } catch (e) {
      list.appendChild(el('div', 'empty', `Could not load that day: ${e.message}`));
      return;
    }
    if (!day) {
      // The first load is dateless, so this is today. Bound the picker by how
      // far back the server will accept a staff add.
      const reach = Number(data.staffBackdateDays);
      $('pick-date').max = data.date;
      $('pick-date').min = shiftDate(data.date, -(Number.isFinite(reach) && reach >= 0 ? reach : 30));
    }
    $('pick-date').value = data.date;

    const scheduled = data.classes.filter((c) => c.start);
    const mine = scheduled.filter((c) => picking.programs.includes(c.program));
    const shown = mine.length ? mine : scheduled;
    if (scheduled.length === 0) $('pick-note').textContent = 'No classes that day.';
    else if (mine.length === 0) $('pick-note').textContent = `Nothing in ${picking.first}'s program that day. All classes are listed.`;

    for (const c of shown) {
      const b = el('button', 'row');
      b.type = 'button';
      b.append(el('span', 'time', formatTime(c.start)), el('span', 'name', c.name));
      if (picking.attended.has(c.startLocal)) b.appendChild(el('span', 'tag', 'already on'));
      else if (c.count) b.appendChild(el('span', 'count', String(c.count)));
      b.addEventListener('click', () => addClass(c.name, c.startLocal));
      list.appendChild(b);
    }
    const open = el('button', 'row');
    open.type = 'button';
    open.append(el('span', 'time', ''), el('span', 'name', 'Open mat'));
    open.addEventListener('click', () => addClass(UNSCHEDULED, `${data.date}T00:00`));
    list.appendChild(open);
  }

  async function addClass(name, startLocal) {
    const m = picking.m;
    try {
      const r = await post('/api/staff/add', { contactId: m.id, className: name, classStartLocal: startLocal });
      toast(r.duplicate ? `${picking.first} was already on the list` : `Added ${picking.first}`);
      $('pick-overlay').classList.remove('active');
      await openMember(m);
    } catch (e) {
      toast(`Could not add: ${e.message}`);
    }
  }

  // ---------- drink tab (brief section 15.3) ----------
  function confirmButton(label, confirmLabel, cls, onConfirm) {
    const b = el('button', cls, label);
    b.type = 'button';
    b.addEventListener('click', async () => {
      if (!b.classList.contains('confirm')) {
        b.classList.add('confirm');
        b.textContent = confirmLabel;
        setTimeout(() => { b.classList.remove('confirm'); b.textContent = label; }, 4000);
        return;
      }
      await onConfirm();
    });
    return b;
  }
  async function loadTab() {
    const list = $('tab-list');
    const activity = $('tab-activity');
    list.innerHTML = '';
    activity.innerHTML = '';
    let data;
    try {
      data = await api(`/api/staff/tab/today${tabDate ? `?date=${tabDate}` : ''}`);
    } catch (e) {
      list.appendChild(el('div', 'empty', e.message));
      return;
    }
    if (!data.enabled) {
      $('tab-summary').textContent = '';
      $('tab-closeout').style.display = 'none';
      list.appendChild(el('div', 'empty', data.pendingMigration ? 'The drink tab needs its database migration.' : data.error ? `The drink tab is misconfigured: ${data.error}` : 'The drink tab is off.'));
      return;
    }
    tabDate = data.date;
    $('tab-closeout').style.display = '';
    $('tab-title').textContent = `Tab, ${fmtDate(data.date)}`;
    const open = data.purchases.filter((p) => p.status === 'open');
    const autoNote = data.autoHour === null || data.autoHour === undefined
      ? 'Charging is by the button only.'
      : `Charges run at ${formatTime(`${String(data.autoHour).padStart(2, '0')}:00`)} for anyone who is due.`;
    const last = data.lastRun
      ? ` Last run ${fmtDate(data.lastRun.ranAt.slice(0, 10))} ${fmtClock(data.lastRun.ranAt)}: ${data.lastRun.started} started, ${data.lastRun.advanced} charged, ${data.lastRun.refreshed} checked${data.lastRun.errors.length ? `, ${data.lastRun.errors.length} need a look` : ''}.`
      : '';
    $('tab-summary').textContent = `${open.length} open line${open.length === 1 ? '' : 's'} today, ${data.openTotal}. ${data.activity.failedToday} wrong PIN${data.activity.failedToday === 1 ? '' : 's'} today. ${autoNote}${last}`;
    for (const l of data.activity.locked) {
      const row = el('div', 'row');
      row.append(el('span', 'name', displayName(l)), el('span', 'tag warn', 'locked'), el('span', 'time', `until ${fmtClock(l.lockedUntil)}`));
      const clear = el('button', 'remove', 'Clear lockout');
      clear.type = 'button';
      clear.addEventListener('click', async () => {
        await post('/api/staff/tab/clear-lockout', { contactId: l.id });
        toast(`Cleared for ${l.first}`);
        await loadTab();
      });
      row.appendChild(clear);
      activity.appendChild(row);
    }
    if (data.purchases.length === 0) {
      list.appendChild(el('div', 'empty', 'Nothing on the tab this day'));
      return;
    }
    for (const p of data.purchases) {
      const row = el('div', 'row');
      row.dataset.purchaseId = p.purchaseId;
      row.append(el('span', 'time', fmtClock(p.purchasedAt)), el('span', 'name', displayName(p)), el('span', 'count', `${p.label} ${p.price}`));
      if (p.method === 'staff') row.appendChild(el('span', 'tag', 'staff'));
      if (p.status === 'voided') row.appendChild(el('span', 'tag warn', 'removed'));
      if (p.status === 'invoiced') row.appendChild(el('span', 'tag gold', 'invoiced'));
      if (p.status === 'open') {
        row.appendChild(confirmButton('Remove', 'Confirm remove', 'remove', async () => {
          await post('/api/staff/tab/void', { purchaseId: p.purchaseId });
          toast(`Removed ${p.label} for ${p.first}`);
          await loadTab();
        }));
      }
      list.appendChild(row);
    }
  }
  $('tab-prev').addEventListener('click', () => { if (tabDate) { tabDate = shiftDate(tabDate, -1); loadTab(); } });
  $('tab-next').addEventListener('click', () => { if (tabDate) { tabDate = shiftDate(tabDate, 1); loadTab(); } });

  // ---------- close-out: review and charge ----------
  // Card status and each charge are one payer per request, driven from here,
  // so the Worker never needs more than a handful of GHL calls in one go.
  let review = null;
  const STATE_LABEL = {
    pending: 'Waiting', schedule_created: 'Invoice created, not yet activated', autopay_on: 'Charging', paid: 'Paid',
    paid_at_pos: 'Charged at POS', failed: 'Not paid, needs a look', skipped_no_card: 'No card on file', skipped_missing_contact: 'Missing contact details',
  };
  $('tab-closeout').addEventListener('click', async () => { showView('closeout'); await loadCloseout(); });
  $('closeout-back').addEventListener('click', async () => { showView('tabview'); await loadTab(); });

  async function loadCloseout() {
    $('closeout-list').innerHTML = '';
    $('closeout-progress').innerHTML = '';
    $('closeout-charge').style.display = 'none';
    $('closeout-note').textContent = '';
    try {
      review = await api('/api/staff/tab/review');
    } catch (e) {
      $('closeout-list').appendChild(el('div', 'empty', e.message));
      return;
    }
    $('closeout-sub').textContent = `${review.minTotal} or ${review.maxRollDays} days`;
    if (review.autoHour !== null && review.autoHour !== undefined && !review.active) {
      $('closeout-note').textContent = `The cron charges everyone who is due at ${formatTime(`${String(review.autoHour).padStart(2, '0')}:00`)}. Remove a wrong line before then, or charge now with the button.`;
    }
    if (review.active) {
      $('closeout-note').textContent = 'A close-out is still in progress. Finish it before starting another.';
      renderProgress(review.active.payers);
      await checkAll(review.active.payers);
      return;
    }
    renderReview();
    for (const p of review.payers.filter((x) => x.charge)) {
      try { p.cardStatus = await api(`/api/staff/tab/card?id=${encodeURIComponent(p.id)}`); }
      catch (e) { p.cardStatus = { ok: false, reason: 'error', error: e.message }; }
      renderReview();
    }
  }
  function cardText(p) {
    if (!p.charge) return `Rolling (${p.total}, under ${review.minTotal})`;
    const c = p.cardStatus;
    if (!c) return 'Checking the card on file';
    if (c.ok) return `${c.card.brand || 'card'} ending ${c.card.last4} (${c.card.source.replace('_', ' ')})`;
    if (c.reason === 'missing_contact') return `Missing ${c.missing.join(' and ')}`;
    if (c.reason === 'no_card') return 'No card on file';
    return `Could not check: ${c.error || c.reason}`;
  }
  function renderReview() {
    const list = $('closeout-list');
    list.innerHTML = '';
    if (review.payers.length === 0) {
      list.appendChild(el('div', 'empty', 'Nothing open on any tab'));
      return;
    }
    for (const p of review.payers) {
      const row = el('div', 'row');
      row.dataset.payer = p.id;
      row.append(el('span', 'name', displayName(p)), el('span', 'count', p.total));
      const status = el('span', `status${p.charge && p.cardStatus && p.cardStatus.ok ? ' gold' : ''}`, cardText(p));
      row.appendChild(status);
      list.appendChild(row);
      for (const l of p.lines) {
        const sub = el('div', 'row sub');
        sub.append(el('span', 'time', `${fmtDate(l.purchasedAt.slice(0, 10))} ${fmtClock(l.purchasedAt)}`), el('span', 'name', `${l.label} ${fmtCents(l.amountCents)}`));
        sub.appendChild(confirmButton('Remove', 'Confirm remove', 'remove', async () => {
          await post('/api/staff/tab/void', { purchaseId: l.purchaseId });
          toast(`Removed ${l.label} for ${p.first}`);
          await loadCloseout();
        }));
        list.appendChild(sub);
      }
    }
    const ready = review.payers.filter((p) => p.charge && p.cardStatus && p.cardStatus.ok);
    const pendingChecks = review.payers.some((p) => p.charge && !p.cardStatus);
    const btn = $('closeout-charge');
    const total = ready.reduce((n, p) => n + p.totalCents, 0);
    btn.style.display = review.payers.some((p) => p.charge) ? '' : 'none';
    btn.disabled = pendingChecks || ready.length === 0;
    btn.textContent = pendingChecks ? 'Checking cards' : ready.length ? `Charge ${ready.length} member${ready.length === 1 ? '' : 's'}, ${fmtCents(total)}` : 'Nobody can be charged';
    btn.classList.remove('confirm');
    btn.onclick = async () => {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = `Confirm: charge ${ready.length} member${ready.length === 1 ? '' : 's'}, ${fmtCents(total)}`;
        setTimeout(() => { btn.classList.remove('confirm'); renderReview(); }, 6000);
        return;
      }
      btn.disabled = true;
      let started;
      try {
        started = await post('/api/staff/tab/closeout', { payerIds: ready.map((p) => p.id) });
      } catch (e) {
        toast(`Could not start: ${e.message}`);
        btn.disabled = false;
        return;
      }
      $('closeout-list').innerHTML = '';
      btn.style.display = 'none';
      renderProgress(started.payers);
      for (const row of started.payers) {
        await runOne(row, 'run');
      }
      toast('Close-out finished');
    };
  }
  function stateText(r) {
    if (r.state === 'autopay_on') return `${r.invoiceStatus === 'sent' ? 'Invoice sent, charging' : 'Charging'}${r.chargeDay ? ` on ${fmtDate(r.chargeDay)}` : ''}`;
    if (r.state === 'skipped_missing_contact' && r.missing) return `Missing ${r.missing.join(' and ')}`;
    return STATE_LABEL[r.state] || r.state;
  }
  function renderProgress(rows) {
    const box = $('closeout-progress');
    box.innerHTML = '';
    for (const r of rows) box.appendChild(progressRow(r));
  }
  function progressRow(r) {
    const row = el('div', 'row');
    row.dataset.cp = r.closeoutPayerId;
    row.append(el('span', 'name', displayName(r)), el('span', 'count', r.total));
    const status = el('span', `status${r.state === 'paid' || r.state === 'paid_at_pos' ? ' gold' : ''}`, stateText(r));
    row.appendChild(status);
    if (r.card) row.appendChild(el('span', 'tag', `${r.card.brand || 'card'} ${r.card.last4}`));
    if (r.state === 'failed' || r.note) row.appendChild(el('span', 'tag warn', r.note || 'needs a look'));
    if (r.state === 'pending' || r.state === 'schedule_created') {
      const retry = el('button', 'remove', 'Retry');
      retry.type = 'button';
      retry.addEventListener('click', () => runOne(r, 'run'));
      row.appendChild(retry);
    }
    if (r.state === 'autopay_on') {
      const check = el('button', 'remove', 'Check');
      check.type = 'button';
      check.addEventListener('click', () => runOne(r, 'refresh'));
      row.appendChild(check);
    }
    if (!['paid', 'paid_at_pos', 'pending'].includes(r.state)) {
      row.appendChild(confirmButton('Charged at POS', 'Confirm charged at POS', 'remove', () => runOne(r, 'pos')));
    }
    return row;
  }
  async function runOne(r, action) {
    const box = $('closeout-progress');
    const existing = box.querySelector(`[data-cp="${r.closeoutPayerId}"]`);
    if (existing) existing.querySelector('.status').textContent = action === 'pos' ? 'Recording' : action === 'refresh' ? 'Checking' : 'Working';
    let out;
    try {
      out = await post(`/api/staff/tab/closeout/${action}`, { closeoutPayerId: r.closeoutPayerId, note: action === 'pos' ? 'staff page' : undefined });
    } catch (e) {
      out = { ok: false, row: { ...r, note: e.message } };
    }
    const row = out.row || { ...r, note: out.error || out.reason || 'no answer' };
    const fresh = progressRow(row);
    if (existing) existing.replaceWith(fresh); else box.appendChild(fresh);
    return row;
  }
  async function checkAll(rows) {
    for (const r of rows) if (r.state === 'autopay_on') await runOne(r, 'refresh');
  }

  function renderMemberTab(d, m) {
    const box = $('member-tab');
    const t = d.tab;
    if (!t || !t.enabled) { box.style.display = 'none'; return; }
    box.style.display = '';
    $('member-tab-total').textContent = t.open.length ? `${t.open.length} open, ${fmtCents(t.openCents)}` : 'nothing open';
    const actions = $('member-tab-actions');
    actions.innerHTML = '';
    const pinText = !t.pin.hasPin ? 'No purchase PIN yet.' : t.pin.locked ? `PIN locked until ${fmtClock(t.pin.lockedUntil)}.` : 'Purchase PIN set.';
    actions.appendChild(el('span', '', pinText));
    if (t.eligible || t.pin.hasPin) {
      const setup = el('button', '', t.pin.hasPin ? 'Reset PIN' : 'Set up PIN');
      setup.type = 'button';
      setup.id = 'member-pin-setup';
      setup.addEventListener('click', async () => {
        try {
          const r = await post('/api/staff/tab/pin-setup', { contactId: m.id });
          // The member types it on that screen; staff never type a PIN.
          const a = el('a', '', 'Open the setup screen and hand it over');
          a.id = 'member-pin-link';
          a.href = r.url;
          a.target = '_blank';
          a.rel = 'noopener';
          setup.replaceWith(a);
        } catch (e) {
          toast(`Could not open setup: ${e.message}`);
        }
      });
      actions.appendChild(setup);
    }
    if (t.pin.locked) {
      const clear = el('button', '', 'Clear lockout');
      clear.type = 'button';
      clear.id = 'member-clear-lock';
      clear.addEventListener('click', async () => { await post('/api/staff/tab/clear-lockout', { contactId: m.id }); toast('Lockout cleared'); await openMember(m); });
      actions.appendChild(clear);
    }
    if (t.noCard) {
      actions.appendChild(el('span', 'tag warn', 'no card on file'));
      const clear = el('button', '', 'Clear no-card flag');
      clear.type = 'button';
      clear.id = 'member-clear-no-card';
      clear.addEventListener('click', async () => { await post('/api/staff/tab/clear-no-card', { contactId: m.id }); toast('Flag cleared'); await openMember(m); });
      actions.appendChild(clear);
    } else if (!t.eligible) {
      actions.appendChild(el('span', 'tag', 'not eligible'));
    }
    const list = $('member-tab-list');
    list.innerHTML = '';
    if (t.recent.length === 0) { list.appendChild(el('div', 'empty', 'No purchases yet')); return; }
    for (const p of t.recent) {
      const row = el('div', 'row');
      row.append(el('span', 'time', fmtDate(p.purchasedAt.slice(0, 10))), el('span', 'name', `${p.label} ${p.price}`), el('span', 'time', fmtClock(p.purchasedAt)));
      if (p.method === 'staff') row.appendChild(el('span', 'tag', 'staff'));
      if (p.status === 'voided') row.appendChild(el('span', 'tag warn', 'removed'));
      if (p.status === 'invoiced') row.appendChild(el('span', 'tag gold', 'invoiced'));
      if (p.status === 'open') {
        row.appendChild(confirmButton('Remove', 'Confirm remove', 'remove', async () => {
          await post('/api/staff/tab/void', { purchaseId: p.purchaseId });
          toast(`Removed ${p.label}`);
          await openMember(m);
        }));
      }
      list.appendChild(row);
    }
  }
  function fmtCents(c) {
    const n = Number(c) || 0;
    return n % 100 === 0 ? `$${n / 100}` : `$${(n / 100).toFixed(2)}`;
  }

  // ---------- nav ----------
  for (const t of document.querySelectorAll('.tab[data-tab]')) {
    t.addEventListener('click', async () => {
      if (t.dataset.tab === 'tonight') { showView('tonight'); await loadTonight(); }
      else if (t.dataset.tab === 'stripes') { showView('stripes'); await loadStripes(); }
      else if (t.dataset.tab === 'tab') { showView('tabview'); await loadTab(); }
      else { showView('members'); $('member-search').focus(); }
    });
  }
  $('signout').addEventListener('click', async () => { await post('/api/staff/logout', {}).catch(() => {}); location.replace('/staff'); });

  // ---------- boot ----------
  loadTonight().catch((e) => { $('tonight-list').textContent = e.message; });
  loadStatus();
  setInterval(() => { if ($('tonight').classList.contains('active')) loadTonight().catch(() => {}); }, 60_000);
</script>
</body>
</html>
