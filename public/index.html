<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Check in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090a;
    --bone: #f4f1e9;
    --gold: #e7c24c;
    --muted: rgba(244, 241, 233, 0.55);
    --line: rgba(244, 241, 233, 0.14);
    --tile: rgba(244, 241, 233, 0.06);
    --display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
    --body: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--bone); font-family: var(--body); }
  body { display: flex; flex-direction: column; align-items: center; padding: max(24px, env(safe-area-inset-top)) 24px 24px; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .screen { width: 100%; max-width: 760px; display: none; flex-direction: column; align-items: center; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen.active { display: flex; }
  .logo { width: 132px; height: 132px; margin-bottom: 20px; }
  .brand { font-family: var(--display); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 20px; color: var(--muted); text-align: center; margin: 0 0 8px; }
  h1 { font-family: var(--display); font-weight: 500; font-size: 56px; line-height: 1; margin: 12px 0 28px; text-align: center; }
  .input { width: 100%; font-family: var(--body); font-size: 30px; font-weight: 500; padding: 22px 24px; border-radius: 16px; border: 2px solid var(--line); background: var(--tile); color: var(--bone); outline: none; text-align: center; }
  .input:focus { border-color: var(--gold); }
  .input::placeholder { color: var(--muted); }
  .tiles { width: 100%; margin-top: 22px; padding-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .tile { font-family: var(--body); text-align: left; background: var(--tile); border: 2px solid var(--line); border-radius: 18px; padding: 22px 24px; color: var(--bone); cursor: pointer; min-height: 96px; display: flex; flex-direction: column; justify-content: center; }
  .tile:active { border-color: var(--gold); }
  .tile .name { font-size: 30px; font-weight: 600; line-height: 1.1; }
  .tile .program { font-size: 17px; color: var(--gold); font-weight: 500; margin-top: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  .hint { margin-top: 18px; color: var(--muted); font-size: 18px; text-align: center; }
  .confirm-name { font-family: var(--display); font-size: 56px; font-weight: 600; line-height: 1; margin: 40px 0 6px; text-align: center; }
  .confirm-program { color: var(--gold); font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; margin-bottom: 44px; }
  .class-line { font-size: 28px; font-weight: 500; text-align: center; margin-bottom: 26px; }
  .class-line .time { color: var(--gold); margin-left: 18px; }
  .btn { width: 100%; font-family: var(--display); font-weight: 600; font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; padding: 26px; border-radius: 18px; border: none; background: var(--gold); color: #1a1607; cursor: pointer; margin-top: 12px; }
  .btn:active { filter: brightness(0.92); }
  .btn.secondary { background: transparent; color: var(--bone); border: 2px solid var(--line); }
  .btn .sub { display: block; font-family: var(--body); font-size: 18px; font-weight: 500; letter-spacing: 0; text-transform: none; margin-top: 6px; opacity: 0.8; }
  .back { margin-top: 26px; background: none; border: none; color: var(--muted); font-family: var(--body); font-size: 20px; padding: 14px 28px; cursor: pointer; }
  .success { justify-content: center; text-align: center; }
  .check { font-family: var(--display); font-size: 120px; line-height: 1; color: var(--gold); }
  .success h2 { font-family: var(--display); font-weight: 500; font-size: 52px; margin: 10px 0 14px; }
  .success p { font-size: 26px; margin: 4px 0; color: var(--bone); }
  .success .count { color: var(--gold); font-weight: 600; }
  .waiver { display: none; margin-top: 34px; padding-top: 26px; border-top: 1px solid var(--line); width: 100%; max-width: 420px; }
  .waiver.active { display: block; }
  .waiver p { font-size: 22px; margin: 0 0 16px; }
  .waiver img { width: 220px; height: 220px; border-radius: 12px; background: var(--bone); padding: 10px; }
  .tab { display: none; margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); width: 100%; max-width: 520px; }
  .tab.active { display: block; }
  .tab .ask { font-family: var(--display); font-weight: 500; font-size: 34px; margin: 0 0 16px; }
  .tab .note { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .drinks { display: flex; gap: 14px; justify-content: center; }
  .drink { flex: 1; font-family: var(--body); background: var(--tile); border: 2px solid var(--line); border-radius: 18px; padding: 18px; color: var(--bone); cursor: pointer; }
  .drink:active { border-color: var(--gold); }
  .drink .n { font-size: 26px; font-weight: 600; }
  .drink .p { color: var(--gold); font-size: 20px; margin-top: 4px; }
  .tab-msg { font-size: 22px; margin-top: 16px; min-height: 28px; }
  .setup p { font-size: 22px; margin: 0 0 12px; }
  .setup .btn.secondary { font-size: 24px; padding: 18px; }
  .pad { position: fixed; inset: 0; background: rgba(9, 9, 10, 0.96); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; padding: 24px; }
  .pad.active { display: flex; }
  .pad h3 { font-family: var(--display); font-weight: 500; font-size: 34px; margin: 0 0 6px; }
  .pad .sub { color: var(--gold); font-size: 20px; margin: 0 0 22px; }
  .dots { display: flex; gap: 18px; margin-bottom: 26px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bone); }
  .dot.on { background: var(--gold); border-color: var(--gold); }
  .keys { display: grid; grid-template-columns: repeat(3, 92px); gap: 14px; }
  .key { font-family: var(--body); font-size: 32px; font-weight: 500; width: 92px; height: 76px; border-radius: 16px; border: 2px solid var(--line); background: var(--tile); color: var(--bone); cursor: pointer; }
  .key:active { border-color: var(--gold); }
  .key.quiet { background: none; border-color: transparent; color: var(--muted); font-size: 17px; }
  .pad .msg { min-height: 28px; color: var(--gold); font-size: 20px; margin-top: 18px; text-align: center; }
  .status { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    h1 { font-size: 42px; }
    .input { font-size: 24px; padding: 18px; }
    .tile .name { font-size: 26px; }
    .confirm-name { font-size: 48px; }
    .btn { font-size: 28px; padding: 22px; }
    .logo { width: 96px; height: 96px; }
  }
</style>
</head>
<body>

<section id="home" class="screen active">
  <img class="logo" src="/logo.png" alt="" onerror="this.style.display='none'">
  <p class="brand">Brazilian Top Team Bridgewater</p>
  <h1>Check in</h1>
  <input id="name-input" class="input" type="text" placeholder="Type your name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="search" aria-label="Type your name">
  <div id="tiles" class="tiles" role="list"></div>
  <p id="hint" class="hint"></p>
</section>

<section id="confirm" class="screen">
  <p class="brand">Brazilian Top Team Bridgewater</p>
  <div id="confirm-name" class="confirm-name"></div>
  <div id="confirm-program" class="confirm-program"></div>
  <div id="confirm-classes" style="width:100%"></div>
  <button id="back" class="back" type="button">Not you? Go back</button>
</section>

<section id="success" class="screen success">
  <div class="check">&#10003;</div>
  <h2>You're checked in</h2>
  <p id="success-class"></p>
  <p id="success-count" class="count"></p>
  <div id="waiver" class="waiver">
    <p>One thing before class: sign the waiver</p>
    <img id="waiver-qr" src="/waiver-qr.png" alt="Waiver QR code" onerror="this.style.display='none'">
  </div>
  <div id="tab" class="tab">
    <p id="tab-ask" class="ask">Thirsty?</p>
    <div id="drinks" class="drinks"></div>
    <p id="tab-note" class="note">Charged to your account.</p>
    <div id="tab-setup" class="setup"></div>
    <p id="tab-msg" class="tab-msg"></p>
  </div>
</section>

<div id="pad" class="pad">
  <h3>Your purchase PIN</h3>
  <p id="pad-sub" class="sub"></p>
  <div id="dots" class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="keys" class="keys"></div>
  <p id="pad-msg" class="msg"></p>
</div>

<div id="status" class="status"></div>

<script type="module">
  import { search, formatTime, displayName } from '/search.js';

  const IDLE_MS = 60_000;
  const SUCCESS_MS = 3_000;
  const SUCCESS_WAIVER_MS = 12_000;
  const SUCCESS_TAB_MS = 45_000;   // holding the screen while a PIN is typed
  const SUCCESS_AFTER_TAB_MS = 7_000;
  const ROSTER_REFRESH_MS = 10 * 60_000;
  const CLASS_REFRESH_MS = 60_000;
  const RETRY_MS = 30_000;
  const QUEUE_KEY = 'btt.checkin.queue';
  const ROSTER_KEY = 'btt.checkin.roster';
  const UNSCHEDULED = 'open mat / unscheduled';

  const $ = (id) => document.getElementById(id);
  const screens = { home: $('home'), confirm: $('confirm'), success: $('success') };
  const input = $('name-input');
  const tiles = $('tiles');
  const hint = $('hint');

  let roster = [];
  let currentClass = { fetchedAt: 0, data: null };
  let selected = null;
  let idleTimer = null;
  let successTimer = null;

  // ---------- storage helpers (never throw) ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* full or blocked; keep going */ }
  }

  // ---------- screens ----------
  function show(name) {
    for (const [k, el] of Object.entries(screens)) el.classList.toggle('active', k === name);
    if (name === 'home') setTimeout(() => input.focus(), 50);
  }
  function goHome() {
    clearTimeout(successTimer);
    closePad();
    successMember = null;
    selected = null;
    input.value = '';
    tiles.innerHTML = '';
    hint.textContent = '';
    show('home');
  }
  function bumpIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goHome, IDLE_MS);
  }
  for (const ev of ['touchstart', 'pointerdown', 'keydown', 'input']) document.addEventListener(ev, bumpIdle, { passive: true });
  bumpIdle();

  // ---------- roster ----------
  async function loadRoster() {
    try {
      const res = await fetch('/api/roster', { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        roster = data;
        save(ROSTER_KEY, data);
      }
    } catch {
      if (roster.length === 0) roster = load(ROSTER_KEY, []);
    }
  }

  // ---------- current class ----------
  async function refreshCurrentClass(timeoutMs = 4000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      const res = await fetch('/api/current-class', { cache: 'no-store', signal: ctl.signal });
      if (!res.ok) throw new Error(String(res.status));
      currentClass = { fetchedAt: Date.now(), data: await res.json() };
    } catch {
      /* keep the last known answer */
    } finally {
      clearTimeout(t);
    }
  }
  async function classesFor(member) {
    if (Date.now() - currentClass.fetchedAt > 90_000) await refreshCurrentClass();
    const data = currentClass.data;
    if (!data) return { date: localDate(), matches: [] };
    const programs = Array.isArray(member.programs) ? member.programs : [];
    return { date: data.date, matches: data.matches.filter((c) => programs.includes(c.program)) };
  }
  function localDate() {
    // Fallback only, when the server has never answered. Uses the device clock.
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // ---------- search ----------
  function renderTiles() {
    const q = input.value;
    const results = search(roster, q);
    tiles.innerHTML = '';
    if (q.trim().length < 2) { hint.textContent = ''; return; }
    if (results.length === 0) {
      hint.textContent = roster.length === 0 ? 'Loading names, one moment' : 'No match yet, keep typing';
      return;
    }
    hint.textContent = '';
    for (const m of results) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile';
      b.setAttribute('role', 'listitem');
      b.dataset.id = m.id;
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = displayName(m);
      const program = document.createElement('div');
      program.className = 'program';
      program.textContent = m.program || '';
      b.append(name, program);
      b.addEventListener('click', () => pick(m));
      tiles.appendChild(b);
    }
  }
  input.addEventListener('input', renderTiles);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = tiles.querySelector('.tile');
      if (first) first.click();
    }
  });

  // ---------- confirm ----------
  async function pick(member) {
    selected = member;
    $('confirm-name').textContent = displayName(member);
    $('confirm-program').textContent = member.program || '';
    const box = $('confirm-classes');
    box.innerHTML = '';
    show('confirm');

    const { date, matches } = await classesFor(member);
    if (selected !== member) return; // user went back while we were fetching
    box.innerHTML = '';
    if (matches.length === 0) {
      const line = document.createElement('div');
      line.className = 'class-line';
      line.textContent = 'No class right now';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn secondary';
      b.id = 'checkin-anyway';
      b.textContent = 'Check in anyway';
      b.addEventListener('click', () => submit(member, { name: UNSCHEDULED, startLocal: `${date}T00:00`, label: 'Open mat' }));
      box.append(line, b);
      return;
    }
    if (matches.length === 1) {
      const c = matches[0];
      const line = document.createElement('div');
      line.className = 'class-line';
      line.textContent = c.name;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(c.start);
      line.appendChild(time);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.id = 'checkin';
      b.textContent = 'Check in';
      b.addEventListener('click', () => submit(member, { name: c.name, startLocal: c.startLocal, label: `${c.name}, ${formatTime(c.start)}` }));
      box.append(line, b);
      return;
    }
    for (const c of matches) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.dataset.class = c.name;
      b.innerHTML = '';
      b.append(document.createTextNode(c.name));
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = formatTime(c.start);
      b.appendChild(sub);
      b.addEventListener('click', () => submit(member, { name: c.name, startLocal: c.startLocal, label: `${c.name}, ${formatTime(c.start)}` }));
      box.appendChild(b);
    }
  }
  $('back').addEventListener('click', goHome);

  // ---------- submit ----------
  let submitting = false;
  async function submit(member, cls) {
    if (submitting) return;
    submitting = true;
    const record = { contactId: member.id, className: cls.name, classStartLocal: cls.startLocal, clientTs: new Date().toISOString() };
    let result = null;
    try {
      result = await post(record);
    } catch {
      enqueue(record);
    }
    submitting = false;
    showSuccess(cls.label, result, member);
  }
  async function post(record) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    try {
      const res = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(record),
        signal: ctl.signal,
      });
      if (res.status >= 500 || res.status === 429) throw new Error(String(res.status));
      // 4xx is final: the server said no and a retry will not change that. Still a success screen for the student.
      return res.ok ? await res.json() : null;
    } finally {
      clearTimeout(t);
    }
  }
  function showSuccess(label, result, member) {
    $('success-class').textContent = label;
    $('success-count').textContent = result && result.classCountLabel ? result.classCountLabel : '';
    const waiver = Boolean(result && result.waiverNeeded);
    $('waiver').classList.toggle('active', waiver);
    successMember = member || null;
    renderTab(result && result.tab ? result.tab : null);
    show('success');
    holdSuccess(waiver ? SUCCESS_WAIVER_MS : SUCCESS_MS);
  }
  function holdSuccess(ms) {
    clearTimeout(successTimer);
    successTimer = setTimeout(goHome, ms);
  }

  // ---------- drink tab (brief section 15.3) ----------
  // Shown only when the server said this member may buy, on a check-in that
  // reached it. Online only: a purchase is never queued, and a failure says so.
  let successMember = null;
  let padItem = null;
  let padDigits = '';
  const LOCKED_COPY = 'Purchases are paused for this account. Ask at the desk.';
  const FAILED_COPY = "That didn't go through. Nothing was added to your tab.";

  function renderTab(tab) {
    const box = $('tab');
    $('drinks').innerHTML = '';
    $('tab-setup').innerHTML = '';
    $('tab-msg').textContent = '';
    box.classList.toggle('active', Boolean(tab));
    if (!tab) return;
    const showing = tab.hasPin && !tab.locked;
    $('tab-ask').style.display = showing ? '' : 'none';
    $('tab-note').style.display = showing ? '' : 'none';
    if (tab.locked) { $('tab-msg').textContent = LOCKED_COPY; return; }
    if (!tab.hasPin) { renderSetup(); return; }
    for (const it of tab.items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'drink';
      b.dataset.item = it.key;
      const n = document.createElement('div');
      n.className = 'n';
      n.textContent = it.label;
      const p = document.createElement('div');
      p.className = 'p';
      p.textContent = it.price;
      b.append(n, p);
      b.addEventListener('click', () => openPad(it));
      $('drinks').appendChild(b);
    }
  }
  function renderSetup() {
    const box = $('tab-setup');
    box.innerHTML = '';
    const line = document.createElement('p');
    line.textContent = 'Set up your purchase PIN';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn secondary';
    b.id = 'pin-link';
    b.textContent = 'Text me a setup link';
    b.addEventListener('click', () => requestLink(b));
    box.append(line, b);
  }
  async function requestLink(button) {
    if (!successMember) return;
    holdSuccess(SUCCESS_TAB_MS);
    button.disabled = true;
    let msg = 'We could not send that. Ask at the desk.';
    try {
      const res = await fetchJson('/api/tab/pin-link', { contactId: successMember.id });
      if (res.ok && res.body.ok) msg = res.body.sent ? 'Check your texts for a link to set your PIN.' : 'We just sent one. Check your texts.';
    } catch {
      /* the message above */
    }
    $('tab-setup').innerHTML = '';
    $('tab-msg').textContent = msg;
    holdSuccess(SUCCESS_AFTER_TAB_MS);
  }
  async function fetchJson(path, body) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    try {
      const res = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
      const parsed = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, body: parsed };
    } finally {
      clearTimeout(t);
    }
  }

  // The PIN pad.
  (function buildKeys() {
    const keys = $('keys');
    const add = (label, cls, onTap) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `key${cls ? ` ${cls}` : ''}`;
      b.dataset.key = label;
      b.textContent = label;
      b.addEventListener('click', onTap);
      keys.appendChild(b);
    };
    for (const d of ['1', '2', '3', '4', '5', '6', '7', '8', '9']) add(d, '', () => padPress(d));
    add('Cancel', 'quiet', () => { closePad(); holdSuccess(SUCCESS_AFTER_TAB_MS); });
    add('0', '', () => padPress('0'));
    add('Delete', 'quiet', () => { padDigits = padDigits.slice(0, -1); renderDots(); });
  })();
  function renderDots() {
    $('dots').querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < padDigits.length));
  }
  function openPad(item) {
    padItem = item;
    padDigits = '';
    $('pad-sub').textContent = `${item.label}, ${item.price}`;
    $('pad-msg').textContent = '';
    renderDots();
    $('pad').classList.add('active');
    holdSuccess(SUCCESS_TAB_MS);
  }
  function closePad() {
    $('pad').classList.remove('active');
    padItem = null;
    padDigits = '';
  }
  let purchasing = false;
  function padPress(d) {
    if (purchasing || padDigits.length >= 4) return;
    padDigits += d;
    renderDots();
    $('pad-msg').textContent = '';
    if (padDigits.length === 4) submitPurchase();
  }
  async function submitPurchase() {
    if (!successMember || !padItem) return;
    purchasing = true;
    const item = padItem;
    let outcome = { kind: 'failed' };
    try {
      const res = await fetchJson('/api/tab/purchase', { contactId: successMember.id, item: item.key, pin: padDigits });
      if (res.ok && res.body.ok) outcome = { kind: 'added', message: res.body.message };
      else if (res.status === 401) outcome = { kind: 'wrong' };
      else if (res.status === 423) outcome = { kind: 'locked' };
      else if (res.status === 409) outcome = { kind: 'no_pin' };
    } catch {
      /* failed */
    }
    purchasing = false;
    if (outcome.kind === 'wrong') {
      padDigits = '';
      renderDots();
      $('pad-msg').textContent = "That PIN didn't match.";
      holdSuccess(SUCCESS_TAB_MS);
      return;
    }
    closePad();
    $('drinks').innerHTML = '';
    $('tab-ask').style.display = 'none';
    $('tab-note').style.display = 'none';
    if (outcome.kind === 'added') $('tab-msg').textContent = outcome.message || 'Added to your tab.';
    else if (outcome.kind === 'locked') $('tab-msg').textContent = LOCKED_COPY;
    else if (outcome.kind === 'no_pin') renderSetup();
    else $('tab-msg').textContent = FAILED_COPY;
    holdSuccess(SUCCESS_AFTER_TAB_MS);
  }

  // ---------- offline queue ----------
  function enqueue(record) {
    const q = load(QUEUE_KEY, []);
    q.push(record);
    save(QUEUE_KEY, q);
    updateStatus();
  }
  async function drainQueue() {
    const q = load(QUEUE_KEY, []);
    if (q.length === 0) return;
    const remaining = [];
    for (const record of q) {
      try {
        await post(record);
      } catch {
        remaining.push(record);
      }
    }
    save(QUEUE_KEY, remaining);
    updateStatus();
  }
  function updateStatus() {
    const n = load(QUEUE_KEY, []).length;
    $('status').textContent = n > 0 ? `${n} check-in${n === 1 ? '' : 's'} waiting to sync` : '';
  }

  // ---------- boot ----------
  roster = load(ROSTER_KEY, []);
  loadRoster();
  refreshCurrentClass();
  updateStatus();
  drainQueue();
  setInterval(loadRoster, ROSTER_REFRESH_MS);
  setInterval(refreshCurrentClass, CLASS_REFRESH_MS);
  setInterval(drainQueue, RETRY_MS);
  window.addEventListener('online', drainQueue);
  // iOS suspends timers while Safari is backgrounded or the iPad sleeps, so
  // the 30 s retry above stops running. Drain on the way back to the front.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) drainQueue(); });
  window.addEventListener('pageshow', drainQueue);
  input.focus();
</script>
</body>
</html>
